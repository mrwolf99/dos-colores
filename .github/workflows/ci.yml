# SPDX-License-Identifier: MIT
# Every job ends with the tree untouched: a test that rewrites what it checks
# is caught from outside the script, not by the script itself.
# Actions are pinned by full commit SHA, with the tag they had when pinned:
# a tag can be moved, a SHA cannot.
# test/publicar.test.mjs reads this file with test/_yaml.mjs, which refuses
# what it does not know instead of guessing: no block scalars (`run: |`),
# anchors or multi-line values; one line per value.
name: ci

on:
  # Branches only: a tag vX.Y.Z runs this same file through publicar.yml,
  # which calls it before publishing. Without the filter it would run twice.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  # In CI a skip is red. The only exemption (the private cleanup list, which
  # never travels) is written next to itself in test/limpieza.test.mjs.
  DOS_COLORES_SIN_SALTOS: "1"

jobs:
  ancla:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        working-directory: packages/ancla
      - run: git diff --exit-code && test -z "$(git status --porcelain)"

  plugin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 18, eslint: 9.39.5 }
          - { node: 20, eslint: 9.39.5 }
          - { node: 22, eslint: 9.39.5 }
          - { node: 24, eslint: 9.39.5 }
          - { node: 26, eslint: 9.39.5 }
          - { node: 20, eslint: 10.11.0 }
          - { node: 22, eslint: 10.11.0 }
          - { node: 24, eslint: 10.11.0 }
          - { node: 26, eslint: 10.11.0 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Outside the workspace on purpose: a workspace install would also bring
      # the plugin's own devDependency and the matrix would test 9.x twice.
      - run: npm install --prefix "$RUNNER_TEMP/eslint" --no-save --no-package-lock --no-audit --no-fund --ignore-scripts "eslint@${{ matrix.eslint }}"
      - run: npm test
        working-directory: packages/eslint-plugin-ancla
        env:
          NODE_PATH: ${{ runner.temp }}/eslint/node_modules
          DOS_COLORES_ESLINT_ESPERADO: ${{ matrix.eslint }}
      - run: git diff --exit-code && test -z "$(git status --porcelain)"

  tipos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npx --yes -p typescript@7.0.2 tsc -p packages/ancla/tipos/tsconfig.json
      - run: git diff --exit-code && test -z "$(git status --porcelain)"

  raiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm run test:raiz
      - run: node scripts/limpieza.mjs --historia
      - run: git diff --exit-code && test -z "$(git status --porcelain)"
